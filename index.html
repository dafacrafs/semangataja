
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>I Love u Princess, Sema ♡</title>

  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #fff5f7, #ffe8ef);
      font-family: 'Quicksand', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow-x: hidden;
      padding: 25px 15px;
      color: #b84d70;
    }

    .container {
      width: 100%;
      max-width: 450px;
      padding: 35px 25px;
      background: rgba(255, 255, 255, 0.65);
      border: 1px solid #ffffff;
      border-radius: 30px;
      box-shadow: 0 10px 35px rgba(226, 126, 157, 0.12);
      position: relative;
      z-index: 2;
      animation: appear 1s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .bow {
      font-size: 40px;
      margin-bottom: 8px;
      animation: wiggle 3s ease-in-out infinite;
    }

    @keyframes wiggle {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(5deg); }
    }

    h1 {
      font-family: 'Pacifico', cursive;
      font-size: clamp(2rem, 8vw, 2.8rem);
      color: #e77d9e;
      font-weight: normal;
      margin-bottom: 12px;
    }

    .subtitle {
      color: #b88a99;
      font-size: 14px;
      letter-spacing: 1px;
    }

    .heart {
      font-size: 25px;
      margin: 20px 0;
      animation: heartbeat 1.5s infinite;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }

    .btn {
      background: #f49bb5;
      color: white;
      border: none;
      border-radius: 30px;
      padding: 13px 30px;
      font-family: 'Quicksand', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(231, 125, 158, 0.2);
      transition: 0.3s;
    }

    .btn:hover {
      background: #e77d9e;
      transform: translateY(-3px);
      box-shadow: 0 8px 18px rgba(231, 125, 158, 0.3);
    }

    .flower {
      font-size: 25px;
      margin-top: 25px;
    }

    .surprise {
      display: none;
      margin-top: 25px;
      padding: 22px 18px;
      background: #fff3f6;
      border: 1px dashed #f2a3ba;
      border-radius: 20px;
      color: #a95672;
      font-size: 14px;
      line-height: 1.9;
      animation: pop 0.7s ease;
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .doll {
      font-size: 45px;
      margin-top: 12px;
    }

    .footer {
      color: #c99aa9;
      font-size: 11px;
      margin-top: 22px;
    }

    /* Hujan hati yang lembut */
    .floating-heart {
      position: fixed;
      top: -30px;
      color: #f5a4bb;
      pointer-events: none;
      z-index: 1;
      animation: falling linear forwards;
    }

    @keyframes falling {
      to {
        transform: translateY(110vh) rotate(35deg);
        opacity: 0;
      }
    }

    @media (max-width: 480px) {
      .container {
        padding: 30px 20px;
      }

      .surprise {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="bow">🎀</div>

    <h1>I love you, Sema</h1>

    <p class="subtitle">
      a little reminder that you're loved ♡
    </p>

    <div class="heart">💗</div>

    <button class="btn" onclick="showSurprise()">
      click me please! ♡
    </button>

    <div class="flower">🌷</div>

    <div class="surprise" id="surprise">

      Semangat sema sayang ujiannya, semuanya akan baik baik aja oke?
      aku selalu mendoakan yang terbaik buat kamu, karna kamu adalah
      yang paling terbaik! good job my love.

      <div class="doll">🧸</div>

    </div>

    <div class="footer">
      made with love, just for you ♡
    </div>

  </div>

  <audio id="audio"
    src="https://files.catbox.moe/dleob6.mp3"
    preload="auto">
  </audio>

  <script>

    // Hujan hati minimalis
    function createHeart() {
      const heart = document.createElement("div");

      heart.className = "floating-heart";
      heart.textContent = "♡";

      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (12 + Math.random() * 12) + "px";
      heart.style.animationDuration = (6 + Math.random() * 4) + "s";

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 10000);
    }

    setInterval(createHeart, 1000);

    // Surprise button
    function showSurprise() {

      const surprise = document.getElementById("surprise");
      const audio = document.getElementById("audio");

      surprise.style.display = "block";

      audio.play().catch(error => {
        console.log("Audio tidak dapat diputar:", error);
      });

      document.querySelector(".btn").textContent = "you are my favorite ♡";
    }

  </script>

</body>
</html>
